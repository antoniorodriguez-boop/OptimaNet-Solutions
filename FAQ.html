<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntes Freqüents | OPTIMANET SOLUTIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #060a13; --bg-card: rgba(16, 24, 45, 0.7); --accent-neon: #00f2fe; --white: #ffffff; --glass-border: 1px solid rgba(255, 255, 255, 0.1); }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: #fff; }
        .glass { background: var(--bg-card); backdrop-filter: blur(12px); border: var(--glass-border); }
        header { position: fixed; top: 20px; width: 100%; z-index: 1000; padding: 0 5%; }
        .navbar { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 35px; border-radius: 50px; }
        .nav-links { display: flex; list-style: none; gap: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 0.9rem; }
        .container { max-width: 900px; margin: 0 auto; padding: 140px 20px 60px; }
        .faq-item { margin-bottom: 15px; border-radius: 15px; padding: 20px; cursor: pointer; }
        #lang-btn { background:none; border:1px solid var(--accent-neon); color:var(--accent-neon); cursor:pointer; padding:5px 12px; border-radius:12px; }
    </style>
</head>
<body>
    <header>
        <nav class="navbar glass">
            <a href="index.html" class="logo">OPTIMANET <span>SOLUTIONS</span></a>
            <ul class="nav-links">
                <li><a href="index.html" data-key="nav_inicio">Inici</a></li>
                <li><button id="lang-btn">CA / EN</button></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 data-key="title">Preguntes Freqüents</h1>
        <div class="faq-item glass">
            <strong data-key="q1">Quant triga una instal·lació?</strong>
            <p data-key="a1">Depèn de la mida, però sol ser entre 24-48 hores.</p>
        </div>
    </div>

    <script>
        const translations = {
            'ca': { 'nav_inicio': 'Inici', 'title': 'Preguntes Freqüents', 'q1': 'Quant triga una instal·lació?', 'a1': 'Depèn de la mida, però sol ser entre 24-48 hores.' },
            'en': { 'nav_inicio': 'Home', 'title': 'Frequently Asked Questions', 'q1': 'How long does an installation take?', 'a1': 'It depends on the size, but usually between 24-48 hours.' }
        };
        let currentLang = localStorage.getItem('lang') || 'ca';
        const langBtn = document.getElementById('lang-btn');
        function update() {
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if(translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
            langBtn.textContent = currentLang === 'ca' ? 'CA / EN' : 'EN / CA';
        }
        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ca' ? 'en' : 'ca';
            localStorage.setItem('lang', currentLang);
            update();
        });
        update();
    </script>
</body>
</html>
