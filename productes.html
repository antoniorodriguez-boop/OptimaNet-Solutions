<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans de Servei | OPTIMANET SOLUTIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060a13;
            --bg-card: rgba(16, 24, 45, 0.7);
            --accent-neon: #00f2fe;
            --text-main: #e2e8f0;
            --white: #ffffff;
            --neon-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        .glass { background: var(--bg-card); backdrop-filter: blur(12px); border: var(--glass-border); }
        header { position: fixed; top: 20px; width: 100%; z-index: 1000; padding: 0 5%; }
        .navbar { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 35px; border-radius: 50px; }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--white); text-decoration: none; }
        .logo span { color: var(--accent-neon); }
        .nav-links { display: flex; list-style: none; gap: 30px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--white); font-size: 0.9rem; }
        .container { max-width: 1300px; margin: 0 auto; padding: 140px 20px 40px; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 10px; color: var(--white); }
        .subtitle { color: var(--accent-neon); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 50px; }
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .plan-card { padding: 40px 25px; border-radius: 25px; transition: 0.4s; position: relative; min-height: 450px; display: flex; flex-direction: column; }
        .plan-card:hover { transform: translateY(-10px); box-shadow: var(--neon-shadow); }
        .plan-name { font-size: 1.5rem; font-weight: 700; color: var(--white); }
        .plan-price { font-size: 2rem; color: var(--accent-neon); margin-bottom: 25px; font-weight: 800; }
        .features-list { list-style: none; text-align: left; margin-bottom: 30px; flex-grow: 1; }
        .features-list li { margin-bottom: 12px; font-size: 0.9rem; }
        .features-list li::before { content: '✓'; color: var(--accent-neon); margin-right: 10px; }
        .btn-plan { text-decoration: none; padding: 12px; border-radius: 12px; font-weight: 700; text-align: center; }
        .btn-primary { background: var(--accent-neon); color: var(--bg-dark); }
        .btn-outline { border: 2px solid var(--accent-neon); color: var(--accent-neon); }
        #lang-btn { background:none; border:1px solid var(--accent-neon); color:var(--accent-neon); cursor:pointer; padding:5px 12px; border-radius:12px; font-weight:600; font-size:0.8rem; }
    </style>
</head>
<body>
    <header>
        <nav class="navbar glass">
            <a href="index.html" class="logo">OPTIMANET <span>SOLUTIONS</span></a>
            <ul class="nav-links">
                <li><a href="index.html" data-key="nav_inicio">Inici</a></li>
                <li><a href="FAQ.html">FAQ</a></li>
                <li><button id="lang-btn">CA / EN</button></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <p class="subtitle" data-key="sub">Escull la teva instal.lació</p>
        <h1 data-key="title">Plans d'Instal.lació</h1>
        <div class="plans-grid">
            <div class="plan-card glass">
                <div class="plan-name" data-key="p1_n">Complet</div>
                <div class="plan-price" data-key="p1_p">Tot Inclòs</div>
                <ul class="features-list">
                    <li data-key="p1_f1">Instal·lació d'ordinadors...</li>
                    <li data-key="p1_f2">Cablejat estructurat</li>
                </ul>
                <a href="#" class="btn-plan btn-outline" data-key="btn">Fer pressupost</a>
            </div>
            </div>
    </div>

    <script>
        const translations = {
            'ca': { 'nav_inicio': 'Inici', 'sub': 'Escull la teva instal.lació', 'title': 'Plans d\'Instal.lació', 'p1_n': 'Complet', 'p1_p': 'Tot Inclòs', 'p1_f1': 'Instal·lació d\'ordinadors, impressores...', 'p1_f2': 'Cablejat estructurat', 'btn': 'Fer pressupost' },
            'en': { 'nav_inicio': 'Home', 'sub': 'Choose your installation', 'title': 'Installation Plans', 'p1_n': 'Complete', 'p1_p': 'All Included', 'p1_f1': 'PC and printer installation...', 'p1_f2': 'Structured cabling', 'btn': 'Get Quote' }
        };
        let currentLang = localStorage.getItem('lang') || 'ca';
        const langBtn = document.getElementById('lang-btn');
        function update() {
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if(translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
            langBtn.textContent = currentLang === 'ca' ? 'CA / EN' : 'EN / CA';
        }
        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ca' ? 'en' : 'ca';
            localStorage.setItem('lang', currentLang);
            update();
        });
        update();
    </script>
</body>
</html>
