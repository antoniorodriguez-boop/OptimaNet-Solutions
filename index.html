<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptimaNet Solutions | Instal·lacions Tecnològiques</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060a13;
            --bg-card: rgba(16, 24, 45, 0.7);
            --accent-neon: #00f2fe;
            --accent-purple: #7000ff;
            --text-main: #e2e8f0;
            --white: #ffffff;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
        }

        /* --- NAVBAR --- */
        header {
            position: fixed;
            top: 20px;
            width: 100%;
            z-index: 1000;
            padding: 0 5%;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 35px;
            border-radius: 50px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span { color: var(--accent-neon); }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 400;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--accent-neon); }

        .btn-cta-nav {
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-purple));
            padding: 10px 22px ;
            border-radius: 25px;
            font-weight: 600 ;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        #lang-btn {
            background: none;
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            cursor: pointer;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        #lang-btn:hover {
            background: var(--accent-neon);
            color: var(--bg-dark);
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.05) 0%, transparent 70%);
        }

        .hero-content { max-width: 850px; }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 700;
            color: var(--white);
        }

        .hero h1 span {
            background: linear-gradient(to right, var(--accent-neon), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-main {
            display: inline-block;
            padding: 16px 40px;
            background: var(--white);
            color: var(--bg-dark);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        /* --- MOBILE MENU --- */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: var(--white);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            .nav-links {
                position: absolute;
                top: 80px;
                right: 5%;
                width: 90%;
                background: rgba(6, 10, 19, 0.95);
                flex-direction: column;
                padding: 30px;
                border-radius: 20px;
                display: none;
                border: var(--glass-border);
            }
            .nav-links.active { display: flex; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar glass">
            <a href="index.html" class="logo">OptimaNet<span> Solutions</span></a>
            
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <ul class="nav-links">
                <li><a href="#inicio" data-key="nav-inici">Inici</a></li>
                <li><a href="#servicios" data-key="nav-mes">Més</a></li>
                <li><a href="faq.html" data-key="nav-faq">FAQ</a></li>
                <li><a href="productes.html" class="btn-cta-nav" data-key="nav-plans">Veure Plans</a></li>
                <li><button id="lang-btn">CA / EN</button></li>
            </ul>
        </nav>
    </header>

    <section id="inicio" class="hero">
        <div class="hero-content">
            <p data-key="hero-cat" style="color: var(--accent-neon); font-weight: 600; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase;">
                Instal·lació Tecnològica
            </p>
            <h1 data-key="hero-title">Muntem la <span>Tecnologia</span> que millora la teva Empresa</h1>
            <p data-key="hero-sub" style="color: #ccc; margin-bottom: 30px; font-size: 1.1rem; max-width: 600px; margin-left: auto; margin-right: auto;">
                Especialistes en instal·lació de xarxes, dispositius i cablejat estructural.
            </p>
            <a href="#servicios" class="btn-main" data-key="btn-mes">Més de nosaltres</a>
        </div>
    </section>

    <script src="idiomes.js"></script>

</body>
</html>
