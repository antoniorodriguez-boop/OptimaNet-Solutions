<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pressupost Ràpid | OPTIMANET SOLUTIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060a13;
            --bg-card: rgba(16, 24, 45, 0.8);
            --accent-neon: #00f2fe;
            --text-main: #e2e8f0;
            --white: #ffffff;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --neon-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            background: radial-gradient(circle at top right, rgba(0, 242, 254, 0.05), transparent), var(--bg-dark);
            min-height: 100vh;
        }

        .glass { background: var(--bg-card); backdrop-filter: blur(12px); border: var(--glass-border); }

        nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: 700; color: white; text-decoration: none; }
        .logo span { color: var(--accent-neon); }
        #lang-btn { background: none; border: 1px solid var(--accent-neon); color: var(--accent-neon); cursor: pointer; padding: 5px 12px; border-radius: 12px; font-weight: 600; font-size: 0.8rem; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .form-header { text-align: center; margin-bottom: 40px; }
        .form-header h1 { font-size: 2.5rem; color: white; }

        .calculator-box { padding: 30px; border-radius: 25px; margin-bottom: 30px; }
        
        .calc-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .input-field { display: flex; flex-direction: column; gap: 10px; }
        label { color: var(--accent-neon); font-size: 0.9rem; font-weight: 600; }
        
        input, select, textarea {
            padding: 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); color: white; outline: none; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-neon); box-shadow: var(--neon-shadow); }

        .total-box {
            text-align: center; margin-top: 30px; padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        #total-display { font-size: 3.5rem; font-weight: 800; color: var(--accent-neon); text-shadow: var(--neon-shadow); }

        form { padding: 40px; border-radius: 30px; display: grid; gap: 20px; }
        .btn-send {
            background: var(--accent-neon); color: var(--bg-dark); padding: 15px; border: none;
            border-radius: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .btn-send:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(0, 242, 254, 0.5); }

        @media (max-width: 600px) { .calc-inputs { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">OPTIMANET <span>SOLUTIONS</span></a>
        <button id="lang-btn">CA / EN</button>
    </nav>

    <div class="container">
        <div class="form-header">
            <h1 data-key="form_title">Pressupost a Mida</h1>
            <p data-key="form_subtitle">Calcula el cost segons les dimensions del teu local</p>
        </div>

        <div class="calculator-box glass">
            <div class="calc-inputs">
                <div class="input-field">
                    <label data-key="label_plan">Tipus de Servei</label>
                    <select id="select-plan">
                        <option value="full" data-key="opt_full" selected>Pack Complet (WiFi + Xarxa + Seguretat + cablejat)</option>
                        <option value="wifi" data-key="opt_wifi">Només Xarxa i WiFi</option>
                        <option value="cameras" data-key="opt_cameras">Només Càmeres de Seguretat</option>
                        <option value="cable" data-key="opt_cable">Només Cablejat Estructural</option>
                    </select>
                </div>
                <div class="input-field">
                    <label data-key="label_m2">Metres Quadrats (m²)</label>
                    <input type="number" id="input-m2" value="50" min="10" step="10">
                </div>
                <div class="input-field">
                    <label data-key="label_plantas">Número de Plantes</label>
                    <input type="number" id="input-plantas" value="1" min="1">
                </div>
                <div class="input-field">
                    <label data-key="label_dificultad">Tipus d'Edifici</label>
                    <select id="select-diff">
                        <option value="1" data-key="diff_easy">Oficina / Local</option>
                        <option value="1.3" data-key="diff_hard">Nau Industrial / Nau</option>
                    </select>
                </div>
            </div>

            <div class="total-box">
                <span data-key="total_label" style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px;">Estimació Aproximada</span>
                <div id="total-display">0€</div>
                <p id="price-disclaimer" style="font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-top: 5px;" data-key="price_note">*Preu final subjecte a revisió tècnica.</p>
            </div>
        </div>

        <form action="https://formspree.io/f/antonio.rodriguez@inslapineda.cat" method="POST" class="glass">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="Preu_Calculat" id="hidden-total">
            <input type="hidden" name="Detalls_Calculadora" id="hidden-summary">

            <div class="input-field">
                <label data-key="label_name">Nom o Empresa</label>
                <input type="text" name="name" required placeholder="Ex: Joan Garcia">
            </div>
            <div class="input-field">
                <label data-key="label_email">Correu de contacte</label>
                <input type="email" name="email" required placeholder="empresa@gmail.com">
            </div>
            <div class="input-field">
                <label data-key="label_desc">Explica'ns què necessites</label>
                <textarea id="text-desc" name="description" rows="4" data-key="desc_placeholder" placeholder="Explica breument el teu projecte o necessitats específiques..." required></textarea>
            </div>
            
            <button type="submit" class="btn-send" data-key="btn_send">Enviar Sol·licitud</button>
        </form>
        <input type="hidden" name="_next" value="https://tuweb.com/index.html">
    </div>

    <script>
        const translations = {
            'ca': {
                'form_title': 'Pressupost a Mida',
                'form_subtitle': 'Calcula el cost segons les dimensions del teu local',
                'label_plan': 'Tipus de Servei',
                'opt_full': 'Pack Complet (WiFi + Xarxa + Seguretat + cablejat)',
                'opt_wifi': 'Només Xarxa i WiFi',
                'opt_cameras': 'Només Càmeres de Seguretat',
                'opt_cable': 'Només Cablejat Estructural',
                'label_m2': 'Metres Quadrats (m²)',
                'label_plantas': 'Número de Plantes',
                'label_dificultad': "Tipus d'Edifici",
                'diff_easy': 'Oficina / Local',
                'diff_hard': 'Nau Industrial / Nau',
                'total_label': 'Estimació Aproximada',
                'price_note': '*Preu final subjecte a revisió tècnica.', 
                'label_name': 'Nom o Empresa',
                'label_email': 'Correu de contacte',
                'label_desc': "Explica'ns què necessites",
                'desc_placeholder': "Explica breument el teu projecte o necessitats específiques...", 
                'btn_send': 'Enviar Sol·licitud'
            },
            'en': {
                'form_title': 'Custom Quote',
                'form_subtitle': 'Calculate the cost based on your local dimensions',
                'label_plan': 'Service Type',
                'opt_full': 'Full Pack (WiFi + Network + Security + cabling)',
                'opt_wifi': 'Network & WiFi Only',
                'opt_cameras': 'Security Cameras Only',
                'opt_cable': 'Structured Cabling Only',
                'label_m2': 'Square Meters (sqm)',
                'label_plantas': 'Number of Floors',
                'label_dificultad': 'Building Type',
                'diff_easy': 'Office / Space',
                'diff_hard': 'Industrial / Complex Installation',
                'total_label': 'Approximate Estimate',
                'price_note': '*Final price subject to technical review.', 
                'label_name': 'Name or Company',
                'label_email': 'Contact Email',
                'label_desc': 'Tell us what you need',
                'desc_placeholder': "Briefly explain your project or specific needs...", 
                'btn_send': 'Send Request'
            }
        };

        const planPrice = { 'full': 12, 'wifi': 7, 'cameras': 6, 'cable': 5 }; 
        const baseFix = { 'full': 600, 'wifi': 250, 'cameras': 300, 'cable': 200 };

        function calcular() {
   
            const selectPlanElement = document.getElementById('select-plan');
            const plan = selectPlanElement.value;
            const planTexto = selectPlanElement.options[selectPlanElement.selectedIndex].text;

            const m2 = parseFloat(document.getElementById('input-m2').value) || 0;
            const plantas = parseInt(document.getElementById('input-plantas').value) || 1;
            
         
            const selectDiffElement = document.getElementById('select-diff');
            const diff = parseFloat(selectDiffElement.value);
            const diffTexto = selectDiffElement.options[selectDiffElement.selectedIndex].text;

          
            let total = (baseFix[plan] + (m2 * planPrice[plan])) * (1 + (plantas - 1) * 0.35) * diff;
            const totalFormateado = Math.round(total) + "€";

        
            document.getElementById('total-display').textContent = totalFormateado;
            
 
            document.getElementById('hidden-total').value = totalFormateado;
            document.getElementById('hidden-summary').value = `Servei: ${planTexto} | M2: ${m2}m² | Plantes: ${plantas} | Edifici: ${diffTexto}`;
        }

        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calcular));

        let currentLang = localStorage.getItem('lang') || 'ca';
        const langBtn = document.getElementById('lang-btn');

        function updateLanguage() {
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[currentLang][key]) {
                    // Si es el textarea, cambiamos el placeholder
                    if (el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[currentLang][key];
                    } else {
                        el.textContent = translations[currentLang][key];
                    }
                }
            });
            langBtn.textContent = currentLang === 'ca' ? 'CA / EN' : 'EN / CA';
        }

        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ca' ? 'en' : 'ca';
            localStorage.setItem('lang', currentLang);
            updateLanguage();
        });

        updateLanguage();
        calcular();
    </script>
</body>
</html>
