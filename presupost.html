<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demana Pressupost | OPTIMANET SOLUTIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060a13;
            --bg-card: rgba(16, 24, 45, 0.8);
            --accent-neon: #00f2fe;
            --text-main: #e2e8f0;
            --white: #ffffff;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --neon-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            background: radial-gradient(circle at top right, rgba(0, 242, 254, 0.05), transparent), var(--bg-dark);
            min-height: 100vh;
        }

        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
        }

        nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.2rem; font-weight: 700; color: white; text-decoration: none; }
        .logo span { color: var(--accent-neon); }

        #lang-btn {
            background: none;
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            cursor: pointer;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-header { text-align: center; margin-bottom: 40px; }
        .form-header h1 { font-size: 2.5rem; color: white; margin-bottom: 10px; }
        .form-header p { color: var(--accent-neon); font-weight: 300; }

        /* Estilos Calculadora */
        .calculator-box {
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .calc-grid { display: grid; gap: 15px; margin-top: 20px; }
        .calc-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .calc-item:hover { border-color: var(--accent-neon); background: rgba(0, 242, 254, 0.05); }
        .calc-item input[type="checkbox"] { width: 18px; height: 18px; margin-right: 15px; cursor: pointer; }
        .calc-price { margin-left: auto; font-weight: 700; color: var(--accent-neon); }

        .total-container {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        #total-display { font-size: 3rem; font-weight: 800; color: var(--accent-neon); text-shadow: var(--neon-shadow); }

        /* Estilos Formulario */
        form {
            padding: 40px;
            border-radius: 30px;
            display: grid;
            gap: 25px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.9rem; font-weight: 600; color: var(--accent-neon); }

        input, select, textarea {
            padding: 12px 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-neon);
            box-shadow: var(--neon-shadow);
        }

        .btn-send {
            background: var(--accent-neon);
            color: var(--bg-dark);
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-send:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(0, 242, 254, 0.5); }

        .back-link { display: inline-block; margin-top: 20px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.8rem; }

        @media (max-width: 600px) {
            form { padding: 25px; }
            h1 { font-size: 1.8rem; }
            #total-display { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">OPTIMANET <span>SOLUTIONS</span></a>
        <button id="lang-btn">CA / EN</button>
    </nav>

    <div class="container">
        <div class="form-header">
            <h1 data-key="form_title">Calcula el teu Pressupost</h1>
            <p data-key="form_subtitle">Selecciona els serveis i demana una confirmació oficial</p>
        </div>

        <div class="calculator-box glass">
            <div class="calc-grid">
                <label class="calc-item">
                    <input type="checkbox" class="calc-check" data-price="150" data-name="Punt WiFi">
                    <span>Punt d'Accés WiFi (AP)</span>
                    <span class="calc-price">+150€</span>
                </label>
                <label class="calc-item">
                    <input type="checkbox" class="calc-check" data-price="250" data-name="Càmera IP">
                    <span>Càmera de Seguretat IP 4K</span>
                    <span class="calc-price">+250€</span>
                </label>
                <label class="calc-item">
                    <input type="checkbox" class="calc-check" data-price="400" data-name="Rack Central">
                    <span>Armari Rack + Switch 24p</span>
                    <span class="calc-price">+400€</span>
                </label>
                <div class="calc-item" style="cursor: default;">
                    <span>Punts de Red (Cablejat)</span>
                    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
                        <input type="number" id="input-puntos" value="0" min="0" style="width: 60px; padding: 5px;">
                        <span style="font-size: 0.8rem; color: var(--accent-neon);">x 70€</span>
                    </div>
                </div>
            </div>

            <div class="total-container">
                <span style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Estimació Total</span>
                <div id="total-display">0€</div>
            </div>
        </div>

        <form action="https://formsubmit.co/optimaNet-solutions@gmail.com" method="POST" class="glass">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="Total_Estimat" id="hidden-total" value="0€">

            <div class="input-group">
                <label data-key="label_name">Nom complet / Empresa</label>
                <input type="text" name="name" placeholder="Ex: Joan Garcia" data-key="ph_name" required>
            </div>

            <div class="input-group">
                <label data-key="label_email">Correu Electrònic</label>
                <input type="email" name="email" placeholder="correu@empresa.com" data-key="ph_email" required>
            </div>

            <div class="input-group">
                <label data-key="label_msg">Detalls o comentaris</label>
                <textarea name="message" id="input-msg" rows="4" placeholder="Alguna cosa més que haguem de saber?" data-key="ph_msg"></textarea>
            </div>

            <button type="submit" class="btn-send" data-key="btn_send">Enviar Sol·licitud</button>
            <a href="productes.html" class="back-link" data-key="back_link">← Tornar als plans</a>
        </form>
    </div>

    <script>
        const translations = {
            'ca': {
                'form_title': 'Calcula el teu Pressupost',
                'form_subtitle': 'Selecciona els serveis i demana una confirmació oficial',
                'label_name': 'Nom complet / Empresa',
                'ph_name': 'Ex: Joan Garcia / PIME Badalona',
                'label_email': 'Correu Electrònic',
                'ph_email': 'correu@empresa.com',
                'label_msg': 'Detalls o comentaris',
                'ph_msg': 'Alguna cosa més que haguem de saber?',
                'btn_send': 'Enviar Sol·licitud',
                'back_link': '← Tornar als plans'
            },
            'en': {
                'form_title': 'Calculate your Budget',
                'form_subtitle': 'Select services and request an official confirmation',
                'label_name': 'Full Name / Company',
                'ph_name': 'Ex: John Doe / SMB London',
                'label_email': 'Email Address',
                'ph_email': 'email@company.com',
                'label_msg': 'Details or comments',
                'ph_msg': 'Anything else we should know?',
                'btn_send': 'Send Request',
                'back_link': '← Back to plans'
            }
        };

        // LÓGICA CALCULADORA
        const checks = document.querySelectorAll('.calc-check');
        const inputPuntos = document.getElementById('input-puntos');
        const displayTotal = document.getElementById('total-display');
        const hiddenTotal = document.getElementById('hidden-total');
        let totalActual = 0;

        function calcular() {
            let nuevoTotal = 0;
            checks.forEach(c => { if(c.checked) nuevoTotal += parseInt(c.dataset.price); });
            nuevoTotal += (parseInt(inputPuntos.value) || 0) * 70;
            
            animarNumero(totalActual, nuevoTotal);
            totalActual = nuevoTotal;
            hiddenTotal.value = nuevoTotal + "€";
        }

        function animarNumero(inicio, fin) {
            let comienzo = null;
            const duracion = 400;
            function paso(timestamp) {
                if (!comienzo) comienzo = timestamp;
                let progreso = Math.min((timestamp - comienzo) / duracion, 1);
                displayTotal.textContent = Math.floor(progreso * (fin - inicio) + inicio) + "€";
                if (progreso < 1) window.requestAnimationFrame(paso);
            }
            window.requestAnimationFrame(paso);
        }

        checks.forEach(c => c.addEventListener('change', calcular));
        inputPuntos.addEventListener('input', calcular);

        // LÓGICA IDIOMA
        let currentLang = localStorage.getItem('lang') || 'ca';
        const langBtn = document.getElementById('lang-btn');

        function updateLanguage() {
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                const translation = translations[currentLang][key];
                if (translation) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = translation;
                    else el.textContent = translation;
                }
            });
            langBtn.textContent = currentLang === 'ca' ? 'CA / EN' : 'EN / CA';
        }

        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ca' ? 'en' : 'ca';
            localStorage.setItem('lang', currentLang);
            updateLanguage();
        });

        updateLanguage();
    </script>
</body>
</html>
